[project]
name = "mia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepgram-sdk>=7.0",
    "anthropic>=0.34",
    "elevenlabs>=1.5",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "rapidfuzz>=3.9",
    "pyobjc-framework-CoreAudio>=10.3; sys_platform == 'darwin'",
    "silero-vad>=5.1",
    "logfire>=1.0",
    "sounddevice>=0.5",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "websockets>=12.0",
    # Imported directly by audio/vad.py and audio/injection.py. It arrives
    # transitively via torch often enough to hide this, but a fresh install
    # without it fails at import time.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
